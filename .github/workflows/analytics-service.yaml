name: Analytics Service - Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:


jobs:
  build-and-unit_test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/analytics-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: src/analytics-service/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -v

  linter-static-analysis:
    needs: build-and-unit_test
    name: Linter/Static Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/analytics-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: src/analytics-service/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run flake8
        run: flake8 .


  security-scan:
    needs: linter-static-analysis
    name: Security Scan (SAST & SCA)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/analytics-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: src/analytics-service/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # SCA - relatorio informativo (HIGH + CRITICAL), nao falha o job sozinho.
      - name: SCA (Trivy) - relatorio de dependencias
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: src/analytics-service
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "0"

      # SCA - regra de bloqueio: falha o job (e trava o pipeline, via "needs"
      # dos jobs seguintes) se achar vulnerabilidade CRITICAL numa dependencia.
      - name: SCA (Trivy) - bloqueio em CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: src/analytics-service
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"

      # SAST - relatorio informativo com todos os achados (--exit-zero nunca falha sozinho).
      - name: SAST (Bandit) - relatorio completo
        run: bandit -r . -x ./tests --exit-zero

      # SAST - regra de bloqueio: bandit nao tem nivel "CRITICAL", entao o
      # equivalente mais proximo e severidade HIGH + confianca HIGH (-lll -iii).
      - name: SAST (Bandit) - bloqueio em High severity/High confidence
        run: bandit -r . -x ./tests -lll -iii

  docker-build-and-push:
    needs: security-scan
    name: Docker Build & Push
    runs-on: ubuntu-latest
    # So builda/publica/faz deploy em push real na main, nunca em PR
    # (evita subir imagem e mexer no gitops-repo por causa de um PR aberto).
    if: github.event_name == 'push'
    outputs:
      tag: ${{ steps.vars.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Definir tag da imagem (commit hash)
        id: vars
        run: echo "tag=v1.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build da imagem Docker
        run: |
          docker build \
            -f Docker/Dockerfile_analytics-service \
            -t "analytics-service:${{ steps.vars.outputs.tag }}" \
            src/

      # Container Scan - regra de bloqueio: falha (e nao publica) se achar
      # CRITICAL na imagem. Docker/.trivyignore documenta a unica excecao
      # aceita hoje (CVE do pacote perl-base da propria imagem base, sem fix
      # publicado ainda pelo Docker Hub - nao e algo do codigo da aplicacao).
      - name: Container Scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: analytics-service:${{ steps.vars.outputs.tag }}
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"
          trivyignores: Docker/.trivyignore

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login no Amazon ECR
        uses: aws-actions/amazon-ecr-login@aded0d722166a37980e030aa969dda0bfe6b6947 # v2.1.7

      - name: Tag e push da imagem para o ECR
        run: |
          docker tag "analytics-service:${{ steps.vars.outputs.tag }}" "${{ vars.ECR_ANALYTICS }}:${{ steps.vars.outputs.tag }}"
          docker push "${{ vars.ECR_ANALYTICS }}:${{ steps.vars.outputs.tag }}"

  update-helm-manifest:
    needs: docker-build-and-push
    name: Update Helm Manifests
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Instalar kustomize
        run: |
          curl -sfLo kustomize.tar.gz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.5.0/kustomize_v5.5.0_linux_amd64.tar.gz"
          tar -xzf kustomize.tar.gz
          sudo mv kustomize /usr/local/bin/

      - name: Atualizar tag da imagem no overlay de producao
        working-directory: gitops-repo/analytics-service/overlays/production
        run: kustomize edit set image "${{ vars.ECR_ANALYTICS }}:${{ needs.docker-build-and-push.outputs.tag }}"

      - name: Commit e push do manifest atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops-repo/analytics-service/overlays/production/kustomization.yaml

          if git diff --cached --quiet; then
            echo "Tag ja esta atualizada, nada para commitar."
            exit 0
          fi

          # [skip ci] evita que este proprio commit dispare o workflow de novo
          # (ele faz push na main, que e um dos gatilhos do "on: push" acima).
          git commit -m "chore(gitops): analytics-service -> ${{ needs.docker-build-and-push.outputs.tag }} [skip ci]"

          # Retry com rebase: outro workflow (de outro servico, ou um commit
          # manual) pode ter dado push na main entre o checkout e agora,
          # rejeitando este push por "cannot lock ref". Como cada servico
          # mexe no seu proprio kustomization.yaml, o rebase e trivial.
          for i in 1 2 3 4 5; do
            if git push origin HEAD:${{ github.ref_name }}; then
              exit 0
            fi
            echo "Push rejeitado (tentativa $i/5), rebaseando e tentando de novo..."
            git fetch origin ${{ github.ref_name }}
            git rebase origin/${{ github.ref_name }}
            sleep $((i * 3))
          done

          echo "Falhou ao dar push depois de 5 tentativas."
          exit 1

  summary:
    name: Workflow Summary
    runs-on: ubuntu-latest
    # always() garante que o relatorio e gerado mesmo se algum job anterior
    # falhar ou for pulado (docker-build-and-push/update-helm-manifest so
    # rodam em push, nao em PR - sem always() este job seria pulado junto).
    if: always()
    needs:
      - build-and-unit_test
      - linter-static-analysis
      - security-scan
      - docker-build-and-push
      - update-helm-manifest

    steps:
      - name: Gerar relatorio do pipeline
        run: |
          status_label() {
            case "$1" in
              success)   echo "✅ sucesso" ;;
              failure)   echo "❌ falhou" ;;
              skipped)   echo "⏭️ pulado" ;;
              cancelled) echo "🚫 cancelado" ;;
              *)         echo "❓ $1" ;;
            esac
          }

          {
            echo "## 📋 Resumo do pipeline - analytics-service"
            echo ""
            echo "| Job | Status |"
            echo "|---|---|"
            echo "| Build & Unit Tests | $(status_label '${{ needs.build-and-unit_test.result }}') |"
            echo "| Linter/Static Analysis | $(status_label '${{ needs.linter-static-analysis.result }}') |"
            echo "| Security Scan (SAST & SCA) | $(status_label '${{ needs.security-scan.result }}') |"
            echo "| Docker Build & Push | $(status_label '${{ needs.docker-build-and-push.result }}') |"
            echo "| Update Helm Manifests | $(status_label '${{ needs.update-helm-manifest.result }}') |"
            echo ""
            echo "**Commit:** \`${GITHUB_SHA::7}\`"
            echo "**Branch:** \`${{ github.ref_name }}\`"
            echo "**Evento:** \`${{ github.event_name }}\` por @${{ github.actor }}"
            if [ -n "${{ needs.docker-build-and-push.outputs.tag }}" ]; then
              echo "**Tag da imagem:** \`${{ needs.docker-build-and-push.outputs.tag }}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
