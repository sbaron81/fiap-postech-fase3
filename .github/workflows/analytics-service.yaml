name: Analytics Service - Deploy

on:
  push:
    branches:
      - main2
  pull_request:
    branches:
      - main2
  workflow_dispatch:


jobs:
  build-and-unit_test:
    name: Build & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/analytics-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: src/analytics-service/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -v

  linter-static-analysis:
    needs: build-and-unit_test
    name: Linter/Static Analysis
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/analytics-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: src/analytics-service/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run flake8
        run: flake8 .


  security-scan:
    needs: linter-static-analysis
    name: Security Scan (SAST & SCA)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/analytics-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: src/analytics-service/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # SCA - relatorio informativo (HIGH + CRITICAL), nao falha o job sozinho.
      - name: SCA (Trivy) - relatorio de dependencias
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: src/analytics-service
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "0"

      # SCA - regra de bloqueio: falha o job (e trava o pipeline, via "needs"
      # dos jobs seguintes) se achar vulnerabilidade CRITICAL numa dependencia.
      - name: SCA (Trivy) - bloqueio em CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: src/analytics-service
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"

      # SAST - relatorio informativo com todos os achados (--exit-zero nunca falha sozinho).
      - name: SAST (Bandit) - relatorio completo
        run: bandit -r . -x ./tests --exit-zero

      # SAST - regra de bloqueio: bandit nao tem nivel "CRITICAL", entao o
      # equivalente mais proximo e severidade HIGH + confianca HIGH (-lll -iii).
      - name: SAST (Bandit) - bloqueio em High severity/High confidence
        run: bandit -r . -x ./tests -lll -iii

  docker-build-and-push:
    needs: security-scan
    name: Docker Build & Push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Definir tag da imagem (commit hash)
        id: vars
        run: echo "tag=v1.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build da imagem Docker
        run: |
          docker build \
            -f Docker/Dockerfile_analytics-service \
            -t "analytics-service:${{ steps.vars.outputs.tag }}" \
            src/

      # Container Scan - regra de bloqueio: falha (e nao publica) se achar
      # CRITICAL na imagem. Docker/.trivyignore documenta a unica excecao
      # aceita hoje (CVE do pacote perl-base da propria imagem base, sem fix
      # publicado ainda pelo Docker Hub - nao e algo do codigo da aplicacao).
      - name: Container Scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: analytics-service:${{ steps.vars.outputs.tag }}
          scanners: vuln
          severity: CRITICAL
          exit-code: "1"
          trivyignores: Docker/.trivyignore

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login no Amazon ECR
        uses: aws-actions/amazon-ecr-login@aded0d722166a37980e030aa969dda0bfe6b6947 # v2.1.7

      - name: Tag e push da imagem para o ECR
        run: |
          docker tag "analytics-service:${{ steps.vars.outputs.tag }}" "${{ vars.ECR_ANALYTICS }}:${{ steps.vars.outputs.tag }}"
          docker push "${{ vars.ECR_ANALYTICS }}:${{ steps.vars.outputs.tag }}"

  update-helm-manifest: 
    needs: docker-build-and-push
    name: Update Helm Manifests
    runs-on: ubuntu-latest

    steps:
      - name: teste
        run: echo "teste"             
