# O analytics-service nao le nenhuma variavel deste Secret hoje - ele acessa
# SQS/DynamoDB usando a IAM role do node do EKS (AmazonSQSFullAccess +
# AmazonDynamoDBFullAccess anexadas na node role pelo Terraform), nao chaves
# estaticas. Mantido vazio/placeholder so para preservar o padrao
# envFrom: [configMapRef, secretRef] caso credenciais explicitas sejam
# necessarias no futuro (ex.: migrar para IRSA por servico).
apiVersion: v1
kind: Secret
metadata:
  name: analytics-service-secrets
type: Opaque
data:
  PLACEHOLDER: c2VtLXNlZ3JlZG9zLW5lY2Vzc2FyaW9zLWhvamU=
