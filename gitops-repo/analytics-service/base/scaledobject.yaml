# Requer o KEDA instalado no cluster:
#   helm repo add kedacore https://kedacore.github.io/charts
#   helm repo update
#   helm install keda kedacore/keda --namespace keda --create-namespace
#
# identityOwner: operator faz o scaler usar as credenciais AWS do proprio
# pod do keda-operator. Como esse pod roda nos mesmos nodes do EKS e a node
# role tem AmazonSQSFullAccess (ver terraform/modules/eks), nenhuma
# TriggerAuthentication e necessaria. Se essa permissao sair da node role no
# futuro, criar uma TriggerAuthentication (IRSA ou access keys) e referenciar
# em spec.triggers[].authenticationRef.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: analytics-service-scaledobject
spec:
  scaleTargetRef:
    name: analytics-service
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 15 # segundos entre cada checagem da fila
  cooldownPeriod: 60 # segundos sem trabalho antes de voltar ao minimo de replicas
  triggers:
    - type: aws-sqs-queue
      metadata:
        queueURL: https://sqs.us-east-1.amazonaws.com/343770067934/fiap-fase3-toggle-events
        queueLength: "1" # 1 mensagem na fila por replica
        awsRegion: us-east-1
        identityOwner: operator
